[project]
name = "rich-utils"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Claudio Spiess", email = "claudiosv@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
rich-utils = "rich_utils:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "ty>=0.0.70",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/rich_utils"]

[tool.ruff.lint]
# Any is the correct type for **kwargs passthrough to Rich's own
# loosely-typed Progress/Task APIs and for the pandas monkey-patch helpers.
extend-ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN",     # test functions don't need full type annotations
    "SLF001",  # tests assert on private state to verify internal behavior
    "PLR2004", # magic values are fine as literal expected values in tests
    "INP001",  # tests/ is not a package
    "D",       # tests don't need docstrings
]
